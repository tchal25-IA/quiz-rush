services:
  - type: web
    name: quiz-rush-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: quiz-rush-db
          property: connectionString
    disk:
      name: unused
      sizeGB: 1
      mountPath: /tmp/unused

databases:
  - name: quiz-rush-db
    plan: free
    databaseName: quizrush
    user: quizrush
