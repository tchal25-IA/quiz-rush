services:
  postgres:
    image: postgres:16-alpine
    container_name: quiz-rush-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quizrush
      POSTGRES_PASSWORD: quizrush
      POSTGRES_DB: quizrush
    ports:
      - "5432:5432"
    volumes:
      - quiz_rush_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizrush -d quizrush"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: quiz-rush-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - quiz_rush_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  quiz_rush_pg:
  quiz_rush_redis:
